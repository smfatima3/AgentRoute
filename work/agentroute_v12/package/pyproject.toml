[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentroute-experiments"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "requests==2.32.5", "PyYAML==6.0.3"]

[project.optional-dependencies]
data = ["datasets==3.6.0", "huggingface-hub==0.34.4"]
models = ["transformers==4.51.3", "sentence-transformers==4.1.0", "openai==1.78.1", "tenacity==9.1.2"]
graphs = ["torch-geometric==2.6.1", "shortuuid==1.0.13", "networkx==3.4.2", "scikit-learn==1.6.1"]
agentnet = ["FlagEmbedding==1.3.5", "peft==0.15.2", "accelerate==1.6.0"]
test = ["pytest==8.4.2"]
plots = ["matplotlib==3.10.3"]

[tool.setuptools.packages.find]
include = ["agentroute*"]
